version: "2"

linters:
  default: standard
  enable:
    - dupl
    - errcheck
    - gocognit
    - gocyclo
    - usetesting
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 15
    dupl:
      threshold: 100
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocyclo
          - gocognit
