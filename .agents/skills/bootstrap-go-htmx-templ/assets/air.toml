root = "."
tmp_dir = "tmp"

[build]
  cmd = "go tool templ generate && go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  delay = 250
  exclude_dir = ["assets", "tmp", "vendor", "bin", ".git"]
  exclude_regex = ["_test\\.go$", "_templ\\.go$"]
  include_ext = ["go", "templ", "css", "js"]
  kill_delay = "0.5s"
  send_interrupt = true
  stop_on_error = true

[screen]
  clear_on_rebuild = false
